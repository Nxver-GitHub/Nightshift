<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center</title>
<style>
  :root {
    --bg:#faf9f6; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e3dc;
    --accent:#534ab7; --high:#a32d2d; --ok:#0f6e56; --wait:#854f0b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#181818; --card:#232323; --ink:#ededed; --muted:#a0a0a0; --line:#333;
            --accent:#afa9ec; --high:#f09595; --ok:#5dcaa5; --wait:#fac775; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:14px; }
  header h1 { font-size:18px; font-weight:500; margin:0; }
  header .sub { color:var(--muted); font-size:13px; }
  main { padding:20px 24px; display:grid; gap:20px; grid-template-columns:1fr; max-width:1400px; }
  h2 { font-size:14px; font-weight:500; color:var(--muted); text-transform:uppercase;
       letter-spacing:.04em; margin:0 0 10px; }
  .board { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .col { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .col h3 { font-size:13px; font-weight:500; margin:0 0 8px; color:var(--muted); }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px;
          font-size:14px; }
  .card .meta { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:1px 6px; border-radius:20px; border:1px solid var(--line); }
  .tag.high { color:var(--high); border-color:var(--high); }
  .tag.prob { color:var(--high); border-color:var(--high); }
  .panels { display:grid; gap:20px; grid-template-columns:1fr 1fr; }
  @media (max-width:820px){ .panels{ grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .kv { display:flex; justify-content:space-between; padding:3px 0; font-size:14px; }
  .due { font-size:13px; padding:4px 0; border-bottom:1px solid var(--line); }
  pre { white-space:pre-wrap; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
        color:var(--ink); margin:0; max-height:340px; overflow:auto; }
  .empty { color:var(--muted); font-size:13px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Command Center</h1>
  <span class="sub" id="clock"></span>
  <span class="sub" style="margin-left:auto"><a href="#" onclick="load();return false">refresh</a></span>
</header>
<main>
  <section>
    <h2>Tasks</h2>
    <div class="board" id="board"><span class="empty">loading…</span></div>
  </section>
  <div class="panels">
    <section class="panel">
      <h2>CRM</h2>
      <div id="crm"><span class="empty">loading…</span></div>
    </section>
    <section class="panel">
      <h2>Brain — main_brain.md</h2>
      <div id="brain"><span class="empty">loading…</span></div>
    </section>
  </div>
</main>
<script>
const COLS = [["todo","To do"],["in_progress","In progress"],["waiting_owner","Waiting on owner"],
              ["done","Done"],["cancelled","Cancelled"]];
function esc(s){ return (s||"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function jget(u){ try { return await (await fetch(u)).json(); } catch(e){ return {available:false}; } }

async function load(){
  document.getElementById("clock").textContent = new Date().toLocaleString();
  const t = await jget("/api/tasks");
  const board = document.getElementById("board");
  if(!t.available){ board.innerHTML = '<span class="empty">No kanban found — set TASKRUNNER_TASKS.</span>'; }
  else {
    board.innerHTML = COLS.map(([k,label])=>{
      const items = t.tasks.filter(x=>(x.status||"todo")===k);
      const cards = items.map(x=>{
        const tags = [];
        if(x.priority==="high") tags.push('<span class="tag high">high</span>');
        if(x.due) tags.push('<span class="tag">due '+esc(x.due)+'</span>');
        if(x.problem) tags.push('<span class="tag prob">problem</span>');
        if(x.claimed_by) tags.push('<span class="tag">@'+esc(x.claimed_by)+'</span>');
        return '<div class="card">'+esc(x.title||x.id)+'<div class="meta">'+tags.join(" ")+'</div></div>';
      }).join("") || '<span class="empty">—</span>';
      return '<div class="col"><h3>'+label+' ('+items.length+')</h3>'+cards+'</div>';
    }).join("");
  }
  const crm = await jget("/api/crm");
  const cdiv = document.getElementById("crm");
  if(!crm.available){ cdiv.innerHTML = '<span class="empty">No CRM found — set CRM_DB.</span>'; }
  else {
    let h = '<div class="kv"><span>companies</span><span>'+crm.companies+'</span></div>';
    for(const [s,n] of Object.entries(crm.by_stage||{})) h += '<div class="kv"><span>'+esc(s)+'</span><span>'+n+'</span></div>';
    h += '<h2 style="margin-top:14px">Due / overdue</h2>';
    h += (crm.due&&crm.due.length) ? crm.due.map(d=>'<div class="due">'+esc(d.title)+' — '+esc(d.next_action||"(no next action)")+' <span class="empty">'+esc(d.next_action_date||"")+'</span></div>').join("")
                                   : '<span class="empty">Nothing due — nothing sleeps.</span>';
    cdiv.innerHTML = h;
  }
  const b = await jget("/api/brain");
  document.getElementById("brain").innerHTML = b.available ? '<pre>'+esc(b.text)+'</pre>'
        : '<span class="empty">No brain found — set BRAIN_DIR.</span>';
}
load();
</script>
</body>
</html>
