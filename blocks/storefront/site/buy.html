<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the landing page, so the buy step doesn't feel like a different company.
     Fonts degrade to system serif/sans if Google Fonts is blocked; nothing here depends on them. */
  :root {
    --ground:    #0A0B10;
    --raised:    #14161D;
    --lip:       #E8E3D914;
    --stone:     #E8E3D9;
    --stone-dim: #8A857A;
    --verdigris: #5FA88F;
    --ground-on-accent: #0A0B10;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ground); color: var(--stone);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  .back {
    display: inline-block; font-family: var(--mono); font-size: .78rem;
    letter-spacing: .06em; color: var(--stone-dim); text-decoration: none;
    padding: 1.5rem 0 0 clamp(1.25rem, 5vw, 2rem);
  }
  .back:hover { color: var(--stone); }
  main { max-width: 40rem; margin: 0 auto; padding: 2rem clamp(1.25rem, 5vw, 2rem) 5rem; }
  .eyebrow {
    font-family: var(--mono); font-size: .75rem; letter-spacing: .22em;
    text-transform: uppercase; color: var(--stone-dim); margin: 0 0 1rem;
  }
  h1 {
    font-family: var(--display); font-weight: 300;
    font-size: clamp(2.1rem, 6vw, 3.1rem); line-height: 1.06;
    letter-spacing: -.015em; margin: 0 0 .75rem;
  }
  .price {
    font-family: var(--mono); font-size: 1.5rem; font-weight: 500;
    color: var(--verdigris); margin: 0 0 1.5rem;
  }
  .tagline {
    font-size: 1.05rem; line-height: 1.55; color: var(--stone-dim); margin: 0 0 2rem;
  }
  .copy p { font-size: 1rem; line-height: 1.7; color: var(--stone); margin: 0 0 1.15rem; }
  .buy-wrap { margin: 2.5rem 0 1rem; }
  .buy-button {
    display: block; width: 100%; text-align: center;
    padding: 1.1rem 1.5rem;
    background: var(--verdigris); color: var(--ground-on-accent);
    font-family: var(--ui); font-size: 1.05rem; font-weight: 600; letter-spacing: .01em;
    text-decoration: none; border: none; border-radius: 3px;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .buy-button:hover { background: var(--stone); transform: translateY(-1px); }
  .buy-button:active { transform: none; }
  /* P7: disclosure sits visibly next to the buy action, not tucked in a footer tooltip. */
  .disclosure {
    font-size: .875rem; line-height: 1.6; color: var(--stone-dim);
    background: var(--raised); border: 1px solid var(--lip);
    border-radius: 3px; padding: 1rem 1.15rem; margin: 0 0 .5rem;
  }
  .disclosure strong { color: var(--stone); font-weight: 600; }
  footer {
    margin-top: 3rem; font-family: var(--mono); font-size: .75rem;
    letter-spacing: .06em; color: var(--stone-dim); text-align: center;
  }
  .error {
    background: var(--raised); border: 1px solid var(--lip); border-radius: 3px;
    padding: 1.25rem; color: var(--stone); font-size: .95rem; line-height: 1.6;
  }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Nightshift</a>
<main id="app">
  <!-- Rendered entirely from ./product.json — this file never hardcodes product content. -->
  <p class="error">Loading…</p>
</main>

<script>
  // Fetch the one content seam. Anyone editing product.json needs to touch nothing else here.
  async function loadProduct() {
    const app = document.getElementById("app");
    try {
      const res = await fetch("./product.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const p = await res.json();
      render(app, p);
    } catch (err) {
      // Never a blank page: show a plain, readable error instead.
      app.innerHTML =
        '<p class="error">Something went wrong loading this product. ' +
        "Please refresh, or try again shortly. (" +
        escapeHtml(String(err && err.message ? err.message : err)) +
        ")</p>";
    }
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function formatPrice(amount, currency) {
    const symbol = (currency || "usd").toLowerCase() === "usd" ? "$" : (currency || "").toUpperCase() + " ";
    // amount is whole units (dollars), matches pay.py's --amount contract.
    const num = Number(amount);
    const display = Number.isInteger(num) ? String(num) : num.toFixed(2);
    return symbol + display;
  }

  function render(app, p) {
    document.title = p.title ? p.title + " — " + (p.company || "") : "Product";

    const copyHtml = (p.copy || [])
      .map(function (para) { return "<p>" + escapeHtml(para) + "</p>"; })
      .join("");

    app.innerHTML =
      '<p class="eyebrow">' + escapeHtml(p.company || "") + "</p>" +
      "<h1>" + escapeHtml(p.title || "") + "</h1>" +
      '<p class="price">' + escapeHtml(formatPrice(p.price_usd, p.currency)) + "</p>" +
      '<p class="tagline">' + escapeHtml(p.tagline || "") + "</p>" +
      '<div class="copy">' + copyHtml + "</div>" +
      '<div class="buy-wrap">' +
      '<a class="buy-button" id="buy-button" href="' + escapeHtml(p.checkout_url || "#") + '">Buy — ' +
      escapeHtml(formatPrice(p.price_usd, p.currency)) +
      "</a>" +
      "</div>" +
      '<p class="disclosure"><strong>Disclosure:</strong> ' + escapeHtml(p.disclosure || "") + "</p>" +
      "<footer>Instant delivery. No account required.</footer>";
  }

  loadProduct();
</script>
</body>
</html>
