<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the landing and the buy page. This is the page a paying customer actually
     lands on, so it is the last place the brand should wobble. */
  :root {
    --ground:    #0A0B10;
    --raised:    #14161D;
    --lip:       #E8E3D914;
    --stone:     #E8E3D9;
    --stone-dim: #8A857A;
    --verdigris: #5FA88F;
    --ground-on-accent: #0A0B10;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ground); color: var(--stone);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem clamp(1.25rem, 5vw, 2rem) 5rem; }
  .eyebrow {
    font-family: var(--mono); font-size: .75rem; letter-spacing: .22em;
    text-transform: uppercase; color: var(--stone-dim); margin: 0 0 1rem;
  }
  h1 {
    font-family: var(--display); font-weight: 300;
    font-size: clamp(2rem, 5.5vw, 2.9rem); line-height: 1.08;
    letter-spacing: -.015em; margin: 0 0 .75rem;
  }
  .lede { font-size: 1.05rem; color: var(--stone-dim); line-height: 1.6; margin: 0 0 2.25rem; }
  .delivery-button {
    display: block; width: 100%; text-align: center;
    padding: 1.1rem 1.5rem;
    background: var(--verdigris); color: var(--ground-on-accent);
    font-family: var(--ui); font-size: 1.05rem; font-weight: 600; letter-spacing: .01em;
    text-decoration: none; border: none; border-radius: 3px; margin: 0 0 1.5rem;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .delivery-button:hover { background: var(--stone); transform: translateY(-1px); }
  .delivery-button:active { transform: none; }
  .note { font-size: .875rem; line-height: 1.6; color: var(--stone-dim); margin: 0 0 1rem; }
  .disclosure {
    font-size: .875rem; line-height: 1.6; color: var(--stone-dim);
    background: var(--raised); border: 1px solid var(--lip);
    border-radius: 3px; padding: 1rem 1.15rem; margin: 1.5rem 0 .5rem;
  }
  .disclosure strong { color: var(--stone); font-weight: 600; }
  .error {
    background: var(--raised); border: 1px solid var(--lip); border-radius: 3px;
    padding: 1.25rem; color: var(--stone); font-size: .95rem; line-height: 1.6;
  }
</style>
</head>
<body>
<main id="app">
  <p class="error">Loading…</p>
</main>

<script>
  // Same content seam as index.html: delivery_url and disclosure both come from product.json.
  async function load() {
    const app = document.getElementById("app");
    try {
      const res = await fetch("./product.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const p = await res.json();
      render(app, p);
    } catch (err) {
      app.innerHTML =
        '<p class="error">Thanks for your order — but we could not load your delivery ' +
        "details automatically. If this page doesn't update shortly, contact support with your " +
        "receipt. (" +
        escapeHtml(String(err && err.message ? err.message : err)) +
        ")</p>";
    }
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function render(app, p) {
    document.title = "Thank you — " + (p.company || "");
    app.innerHTML =
      '<p class="eyebrow">' + escapeHtml(p.company || "") + "</p>" +
      "<h1>Thank you for your order</h1>" +
      '<p class="lede">Your purchase of <strong>' + escapeHtml(p.title || "") +
      "</strong> is complete.</p>" +
      '<a class="delivery-button" id="delivery-link" href="' + escapeHtml(p.delivery_url || "#") + '">' +
      "Access your download</a>" +
      '<p class="note">A receipt for this purchase comes separately from the payment provider — ' +
      "check your email.</p>" +
      '<p class="disclosure"><strong>Disclosure:</strong> ' + escapeHtml(p.disclosure || "") + "</p>";
  }

  load();
</script>
</body>
</html>
