<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #151517;
    --border: #2a2a2e;
    --text: #f2f2f0;
    --muted: #a3a3a8;
    --accent: #5eead4;
    --accent-text: #04201b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  h1 {
    font-size: 28px;
    line-height: 1.2;
    margin: 0 0 12px;
  }
  .lede {
    font-size: 17px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 28px;
  }
  .delivery-button {
    display: block;
    width: 100%;
    text-align: center;
    padding: 18px 24px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 12px;
    border: none;
    margin: 0 0 24px;
  }
  .note {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .disclosure {
    font-size: 14px;
    line-height: 1.5;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 24px 0 8px;
  }
  .disclosure strong { color: var(--text); }
  .error {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main id="app">
  <p class="error">Loading…</p>
</main>

<script>
  // Same content seam as index.html: delivery_url and disclosure both come from product.json.
  async function load() {
    const app = document.getElementById("app");
    try {
      const res = await fetch("./product.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const p = await res.json();
      render(app, p);
    } catch (err) {
      app.innerHTML =
        '<p class="error">Thanks for your order — but we could not load your delivery ' +
        "details automatically. If this page doesn't update shortly, contact support with your " +
        "receipt. (" +
        escapeHtml(String(err && err.message ? err.message : err)) +
        ")</p>";
    }
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function render(app, p) {
    document.title = "Thank you — " + (p.company || "");
    app.innerHTML =
      '<p class="eyebrow">' + escapeHtml(p.company || "") + "</p>" +
      "<h1>Thank you for your order</h1>" +
      '<p class="lede">Your purchase of <strong>' + escapeHtml(p.title || "") +
      "</strong> is complete.</p>" +
      '<a class="delivery-button" id="delivery-link" href="' + escapeHtml(p.delivery_url || "#") + '">' +
      "Access your download</a>" +
      '<p class="note">A receipt for this purchase comes separately from the payment provider — ' +
      "check your email.</p>" +
      '<p class="disclosure"><strong>Disclosure:</strong> ' + escapeHtml(p.disclosure || "") + "</p>";
  }

  load();
</script>
</body>
</html>
